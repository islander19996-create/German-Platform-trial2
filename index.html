  <style>
    body {
      font-family: 'Nunito', sans-serif;
      background-color: #f7f7f7;
      user-select: none;
    }
    /* Фирменные 3D-кнопки в стиле Duolingo */
    .btn-duo-green {
      background-color: #58cc02;
      box-shadow: 0 4px 0 #58a700;
      color: white;
      transition: all 0.1s;
    }
    .btn-duo-green:hover { background-color: #61e002; }
    .btn-duo-green:active {
      transform: translateY(4px);
      box-shadow: 0 0px 0 #58a700;
    }
    .btn-duo-blue {
      background-color: #1cb0f6;
      box-shadow: 0 4px 0 #1899d6;
      color: white;
      transition: all 0.1s;
    }
    .btn-duo-blue:hover { background-color: #2bd5ff; }
    .btn-duo-blue:active {
      transform: translateY(4px);
      box-shadow: 0 0px 0 #1899d6;
    }
    .btn-duo-yellow {
      background-color: #ffc800;
      box-shadow: 0 4px 0 #e5a400;
      color: #4b4b4b;
      transition: all 0.1s;
    }
    .btn-duo-yellow:active {
      transform: translateY(4px);
      box-shadow: 0 0px 0 #e5a400;
    }
    .btn-duo-gray {
      background-color: #ffffff;
      border: 2px solid #e5e5e5;
      box-shadow: 0 4px 0 #e5e5e5;
      color: #4b4b4b;
      transition: all 0.1s;
    }
    .btn-duo-gray:hover { background-color: #f7f7f7; border-color: #cecece; }
    .btn-duo-gray:active {
      transform: translateY(4px);
      box-shadow: 0 0px 0 #e5e5e5;
    }
    .card-duo {
      background: white;
      border: 2px solid #e5e5e5;
      border-radius: 1.25rem;
      box-shadow: 0 4px 0 #e5e5e5;
    }
    /* 3D Переворот флеш-карт */
    .perspective { perspective: 1000px; }
    .flip-card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.5s;
      transform-style: preserve-3d;
    }
    .flipped .flip-card-inner {
      transform: rotateY(180deg);
    }
    .flip-card-front, .flip-card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 1.5rem;
    }
    .flip-card-back {
      transform: rotateY(180deg);
    }
  </style>
</head>

<script>
// ============================================================================
// 1. БАЗА ДАННЫХ УРОКОВ (A1 - B2)
// ============================================================================
const MODULES = [
  {
    id: "a1_1",

    title: "Модуль 1: Знакомство, Фонетика, Глаголы в Präsens",

    color: "#58cc02",
    icon: "fa-handshake",

                <th class="p-3">machen (делать)</th>

              <tr><td class="p-3 font-bold text-[#1cb0f6]">du (ты)</td><td class="p-3 text-red-500">-st</td><td class="p-3">du mach<b>st</b></td><td class="p-3">du <b>bist</b></td><td class="p-3">du <b>hast</b></td></tr>
              <tr><td class="p-3 font-bold text-[#1cb0f6]">er/sie/es (он/она/оно)</td><td class="p-3 text-red-500">-t</td><td class="p-3">er mach<b>t</b></td><td class="p-3">er <b>ist</b></td><td class="p-3">er <b>hat</b></td></tr>
              <tr><td class="p-3 font-bold text-[#1cb0f6]">wir (мы)</td><td class="p-3 text-red-500">-en</td><td class="p-3">wir mach<b>en</b></td><td class="p-3">wir <b>sind</b></td><td class="p-3">wir <b>haben</b></td></tr>

              <tr><td class="p-3 font-bold text-[#1cb0f6]">sie / Sie (они / Вы)</td><td class="p-3 text-red-500">-en</td><td class="p-3">Sie mach<b>en</b></td><td class="p-3">Sie <b>sind</b></td><td class="p-3">Sie <b>haben</b></td></tr>
            </tbody>
          </table>
        </div>
        <div class="bg-blue-50 border-l-4 border-[#1cb0f6] p-4 rounded-r-xl">

          • <i>Ich <b>komme</b> heute aus Berlin.</i> (Прямой порядок)<br>
          • <i>Heute <b>komme</b> ich aus Berlin.</i> (Обратный порядок — глагол всё равно второй!)</p>
        </div>
      </div>
    `,
    vocab: [

      { de: "Auf Wiedersehen", ru: "До свидания", ex: "Auf Wiedersehen und bis morgen!" },
      { de: "heißen", ru: "зваться, называться", ex: "Wie heißen Sie? Ich heiße Thomas." },

      { de: "lernen", ru: "учить, учиться", ex: "Wir lernen zusammen Deutsch." },

      { de: "vielleicht", ru: "возможно, может быть", ex: "Vielleicht komme ich heute Abend." },
      { de: "zusammen", ru: "вместе", ex: "Wir machen das Projekt zusammen." }
    ],
    dialogues: [
      { speaker: "Anna", de: "Hallo! Ich heiße Anna. Und wie heißt du?", ru: "Привет! Меня зовут Анна. А как зовут тебя?" },

      { speaker: "Anna", de: "Interessant! Was machst du beruflich? Studierst du oder arbeitest du?", ru: "Интересно! Чем ты занимаешься по профессии? Учишься или работаешь?" },

    ],
    grammarQuestions: [

      { type: "mc", q: "Выберите правильную форму: «Woher ___ du?»", options: ["komme", "kommst", "kommt", "kommen"], a: "kommst", exp: "Для местоимения du добавляется окончание -st." },
      { type: "input", q: "Впишите правильную форму глагола haben: «Er ___ ein Auto.»", a: "hat", exp: "В 3-м лице ед. числа (er/sie/es) глагол haben меняется на hat." },
      { type: "mc", q: "Выберите правильную форму: «Wir ___ in Kiew.»", options: ["wohne", "wohnst", "wohnt", "wohnen"], a: "wohnen", exp: "С местоимением wir глагол получает окончание -en." },
      { type: "input", q: "Впишите правильную форму глагола sein: «___ ihr müde?» (Вы устали?)", a: "Seid", exp: "Для местоимения ihr глагол sein имеет форму seid." },
      { type: "mc", q: "Глагол sprechen меняет корневую гласную e → i. Как сказать «Ты говоришь»?", options: ["Du sprechst", "Du sprichst", "Du spricht", "Du sprechen"], a: "Du sprichst", exp: "Сильный глагол sprechen: ich spreche, du sprichst, er spricht." },
      { type: "mc", q: "Выберите правильный порядок слов: «Сегодня я учу немецкий»", options: ["Heute ich lerne Deutsch.", "Heute lerne ich Deutsch.", "Ich heute lerne Deutsch.", "Deutsch ich lerne heute."], a: "Heute lerne ich Deutsch.", exp: "Правило V2: глагол lerne обязан стоять на 2-м месте." },
      { type: "input", q: "Впишите форму глагола heißen: «Wie ___ Sie?»", a: "heißen", exp: "С вежливой формой Sie глагол всегда имеет окончание -en." }

  {

    icon: "fa-apple-whole",
    grammarHTML: `
      <div class="space-y-6">
        <div class="bg-blue-50 border-l-4 border-blue-500 p-4 rounded-r-xl">

// Синтез немецкой речи
function speakGerman(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  // Очищаем грамматические пометки в скобках для чистого чтения
  const cleanText = text.replace(/\(.*?\)/g, '').replace(/¨-er|¨-e|¨-|-en|-n|-e/g, '').trim();
  const utter = new SpeechSynthesisUtterance(cleanText);
  utter.lang = 'de-DE';
  utter.rate = 0.92;
  window.speechSynthesis.speak(utter);
}

// 6. ОТКРЫТИЕ МОДУЛЯ (ГРАММАТИКА, ФЛЕШ-КАРТЫ, ДИАЛОГ, ТЕСТ НА 18 ВОПРОСОВ)
// ============================================================================
function openModule(modId, subTab = 'grammar') {
  state.activeModuleId = modId;
  state.activeSubTab = subTab;
  const mod = MODULES.find(m => m.id === modId);
  if (!mod) return;

  // Инициализация флеш-карт при входе
  if (subTab === 'flashcards' && state.fcList.length === 0) {
    state.fcList = [...mod.vocab];
    state.fcIndex = 0;
    state.fcFlipped = false;
  }

  // Генерация 18 вопросов при открытии вкладки теста
  if (subTab === 'quiz') {
    generateQuizForModule(mod);
  }

  renderModuleScreen();
}

function switchModuleSubTab(subTab) {
  const mod = MODULES.find(m => m.id === state.activeModuleId);
  state.activeSubTab = subTab;
  if (subTab === 'flashcards') {
    state.fcList = [...mod.vocab];
    state.fcIndex = 0;
    state.fcFlipped = false;
  }
  if (subTab === 'quiz') {
    generateQuizForModule(mod);
  }
  renderModuleScreen();
}

function renderModuleScreen() {
  const mod = MODULES.find(m => m.id === state.activeModuleId);
  const container = document.getElementById('main-container');

  const subTabs = [
    { id: 'grammar', label: '1. Грамматика и Словарь', icon: 'fa-book-open' },
    { id: 'flashcards', label: '2. 3D Флеш-карты', icon: 'fa-clone' },
    { id: 'dialogue', label: '3. Диалог и Произношение', icon: 'fa-comments' },
    { id: 'quiz', label: '4. Большой Тест (18 вопросов)', icon: 'fa-graduation-cap' }
  ];

  let navHtml = subTabs.map(t => {
    const active = state.activeSubTab === t.id;
    return `
      <button onclick="switchModuleSubTab('${t.id}')" class="px-4 py-2.5 rounded-xl font-extrabold text-sm flex items-center space-x-2 transition ${active ? 'bg-[#1cb0f6] text-white shadow-[0_3px_0_#1899d6]' : 'bg-white text-gray-600 border-2 border-gray-200 hover:bg-gray-50'}">
        <i class="fa-solid ${t.icon}"></i>
        <span>${t.label}</span>
      </button>
    `;
  }).join('');

  let contentHtml = '';
  if (state.activeSubTab === 'grammar') contentHtml = getGrammarAndVocabHTML(mod);
  if (state.activeSubTab === 'flashcards') contentHtml = getFlashcardsHTML(mod);
  if (state.activeSubTab === 'dialogue') contentHtml = getDialogueHTML(mod);
  if (state.activeSubTab === 'quiz') contentHtml = getQuizHTML(mod);

  container.innerHTML = `
    <div class="max-w-4xl mx-auto">
      <div class="flex items-center justify-between mb-6">
        <button onclick="renderPathView()" class="btn-duo-gray px-4 py-2 rounded-xl font-extrabold text-sm flex items-center space-x-2">
          <i class="fa-solid fa-arrow-left"></i>
          <span>К карте курсов</span>
        </button>
        <span class="px-3 py-1 rounded-full bg-gray-200 text-gray-700 font-black text-xs uppercase">Уровень ${mod.level}</span>
      </div>

      <h2 class="text-2xl md:text-3xl font-black text-gray-800 mb-2">${mod.title}</h2>
      <p class="text-gray-500 font-semibold mb-6">${mod.subtitle}</p>

      <div class="flex flex-wrap gap-2 mb-8">

  renderModuleScreen();

function shuffleFlashcards() {

    [state.fcList[i], state.fcList[j]] = [state.fcList[j], state.fcList[i]];
  }
  state.fcIndex = 0;
  state.fcFlipped = false;
  renderModuleScreen();
}

// ============================================================================
// 7. ГЕНЕРАТОР БОЛЬШОГО ТЕСТА (18 ВОПРОСОВ НА КАЖДЫЙ МОДУЛЬ)
// ============================================================================
function generateQuizForModule(mod) {
  let questions = [];
  // 1. Добавляем 8 авторских грамматических вопросов модуля
  mod.grammarQuestions.forEach(gq => {
    questions.push({ ...gq });
  });

  // 2. Динамически генерируем еще 10 лексико-грамматических вопросов из словаря урока (итого 18 вопросов!)
  const vocabPool = [...mod.vocab];
  vocabPool.slice(0, 6).forEach(item => {
    // Генерируем 3 неверных варианта перевода из других слов
    const wrongOptions = mod.vocab
      .filter(v => v.ru !== item.ru)
      .sort(() => 0.5 - Math.random())
      .slice(0, 3)
      .map(v => v.ru);
    const allOptions = [...wrongOptions, item.ru].sort(() => 0.5 - Math.random());

    questions.push({
      type: "mc",
      q: `Как переводится выражение: «${item.de}»?`,
      options: allOptions,
      a: item.ru,
      exp: `Пример: ${item.ex}`
    });
  });

  // 3. Добавляем 4 письменных задания (ввод немецкого слова по переводу)
  vocabPool.slice(6, 10).forEach(item => {
    // Очищаем словарную запись от форм мн. числа после запятой для удобства ввода
    const cleanTarget = item.de.split(',')[0].replace(/\(.*?\)/g, '').trim();
    questions.push({
      type: "input",
      q: `Напишите по-немецки (если существительное — с артиклем): «${item.ru}»`,
      a: cleanTarget,
      exp: `Полная словарная форма: ${item.de}. Пример: ${item.ex}`
    });
  });

  state.quizQuestions = questions;
  state.quizIndex = 0;
  state.quizScore = 0;
  state.quizAnswered = false;
}

function getQuizHTML(mod) {
  if (state.quizIndex >= state.quizQuestions.length) {
    const pct = Math.round((state.quizScore / state.quizQuestions.length) * 100);
    return `
      <div class="card-duo p-10 text-center space-y-6">
        <div class="text-6xl">${pct >= 75 ? '🏆' : '💪'}</div>
        <h3 class="text-3xl font-black text-gray-800">Тест завершен!</h3>
        <p class="text-lg font-bold text-gray-600">Ваш результат: <span class="text-[#58cc02] font-black">${state.quizScore} из ${state.quizQuestions.length}</span> (${pct}%)</p>
        <div class="flex justify-center space-x-4">
          <button onclick="switchModuleSubTab('quiz')" class="btn-duo-blue px-6 py-3 rounded-2xl font-black text-sm uppercase">
            Пройти еще раз
          </button>
          <button onclick="renderPathView()" class="btn-duo-green px-6 py-3 rounded-2xl font-black text-sm uppercase">
            Вернуться к карте
          </button>
        </div>
      </div>
    `;
  }

  const qObj = state.quizQuestions[state.quizIndex];
  const progressPct = Math.round((state.quizIndex / state.quizQuestions.length) * 100);

  let interactionHtml = '';
  if (qObj.type === 'mc') {
    interactionHtml = `
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-6">
        ${qObj.options.map((opt, idx) => `
          <button onclick="submitQuizAnswer('${opt.replace(/'/g, "\\'")}')" id="q-opt-${idx}" class="btn-duo-gray p-4 rounded-2xl font-extrabold text-left text-base flex items-center space-x-3">
            <span class="w-8 h-8 rounded-lg bg-gray-100 text-gray-500 flex items-center justify-center font-black text-xs shrink-0">${idx + 1}</span>
            <span>${opt}</span>
          </button>
        `).join('')}
      </div>
    `;
  } else {
    interactionHtml = `
      <div class="mt-6 space-y-4">
        <div class="flex flex-wrap gap-2">
          ${['ä', 'ö', 'ü', 'ß', 'Ä', 'Ö', 'Ü'].map(ch => `
            <button onclick="insertUmlaut('${ch}')" type="button" class="btn-duo-gray px-3.5 py-1.5 rounded-xl font-black text-sm">${ch}</button>
          `).join('')}
        </div>
        <div class="flex space-x-3">
          <input id="quiz-text-input" type="text" placeholder="Введите ответ на немецком..." class="flex-1 p-4 rounded-2xl border-2 border-gray-300 font-bold text-lg focus:outline-none focus:border-[#1cb0f6]" onkeydown="if(event.key==='Enter') submitQuizTextInput()">
          <button onclick="submitQuizTextInput()" class="btn-duo-green px-6 rounded-2xl font-black uppercase text-sm">Проверить</button>
        </div>
      </div>
    `;
  }

  return `
    <div class="card-duo p-8">
      <!-- Прогресс-бар теста -->
      <div class="flex items-center space-x-4 mb-6">
        <div class="flex-1 bg-gray-200 h-4 rounded-full overflow-hidden">
          <div class="bg-[#58cc02] h-full transition-all duration-300" style="width: ${progressPct}%"></div>
        </div>
        <span class="font-black text-xs text-gray-500 uppercase">${state.quizIndex + 1} / ${state.quizQuestions.length}</span>
      </div>

      <span class="text-xs font-black uppercase tracking-wider text-[#1cb0f6]">${qObj.type === 'mc' ? 'Выберите правильный ответ' : 'Письменное задание'}</span>
      <h3 class="text-xl md:text-2xl font-black text-gray-800 mt-1">${qObj.q}</h3>

      ${interactionHtml}

      <!-- Блок обратной связи -->
      <div id="quiz-feedback" class="hidden mt-6 p-5 rounded-2xl border-2"></div>
    </div>
  `;
}

function insertUmlaut(char) {
  const input = document.getElementById('quiz-text-input');
  if (!input) return;
  input.value += char;
  input.focus();
}

function submitQuizTextInput() {
  const input = document.getElementById('quiz-text-input');
  if (!input || !input.value.trim()) return;
  submitQuizAnswer(input.value.trim());
}

function submitQuizAnswer(userAns) {
  if (state.quizAnswered) return;
  state.quizAnswered = true;

  const qObj = state.quizQuestions[state.quizIndex];
  const isCorrect = userAns.trim().toLowerCase() === qObj.a.trim().toLowerCase();
  const fb = document.getElementById('quiz-feedback');
  fb.classList.remove('hidden');

  if (isCorrect) {
    state.quizScore++;
    state.xp += 10;
    fb.className = "mt-6 p-5 rounded-2xl border-2 bg-green-50 border-[#58cc02] flex flex-col md:flex-row items-start md:items-center justify-between gap-4";
    fb.innerHTML = `
      <div>
        <div class="font-black text-[#58a700] text-lg flex items-center space-x-2">
          <i class="fa-solid fa-circle-check"></i>
          <span>Отлично! Верный ответ (+10 XP)</span>
        </div>
        <p class="text-sm font-semibold text-green-800 mt-1">${qObj.exp}</p>
      </div>
      <button onclick="nextQuizQuestion()" class="btn-duo-green px-6 py-3 rounded-xl font-black text-xs uppercase shrink-0">Дальше</button>
    `;
  } else {
    state.hearts = Math.max(0, state.hearts - 1);
    fb.className = "mt-6 p-5 rounded-2xl border-2 bg-red-50 border-red-400 flex flex-col md:flex-row items-start md:items-center justify-between gap-4";
    fb.innerHTML = `
      <div>
        <div class="font-black text-red-600 text-lg flex items-center space-x-2">
          <i class="fa-solid fa-circle-xmark"></i>
          <span>Правильный ответ: ${qObj.a}</span>
        </div>
        <p class="text-sm font-semibold text-red-800 mt-1">${qObj.exp}</p>
      </div>
      <button onclick="nextQuizQuestion()" class="btn-duo-blue px-6 py-3 rounded-xl font-black text-xs uppercase shrink-0">Понятно, дальше</button>
    `;
  }
  saveState();
}

function nextQuizQuestion() {
  state.quizIndex++;
  state.quizAnswered = false;
  if (state.quizIndex >= state.quizQuestions.length) {
    if (!state.completedModules.includes(state.activeModuleId)) {
      state.completedModules.push(state.activeModuleId);
      state.xp += 50;
      saveState();
    }
  }
  renderModuleScreen();
}

function checkStrongVerbInput() {
  const pretIn = document.getElementById('verb-in-pret').value.trim().toLowerCase();
  const partIn = document.getElementById('verb-in-part').value.trim().toLowerCase();
  const fb = document.getElementById('verb-feedback');
  fb.classList.remove('hidden');

  const okPret = pretIn === verbQuizTarget.pret.toLowerCase();
  const okPart = partIn === verbQuizTarget.part.toLowerCase() || partIn === verbQuizTarget.part.split(' ')[1]?.toLowerCase();

  if (okPret && okPart) {
    state.xp += 15;
    saveState();
    fb.className = "mt-4 p-4 rounded-xl font-bold text-sm bg-green-100 text-green-800";
    fb.innerHTML = `✅ Безупречно! <b>${verbQuizTarget.inf} — ${verbQuizTarget.pres} — ${verbQuizTarget.pret} — ${verbQuizTarget.part}</b> (+15 XP)`;
    speakGerman(`${verbQuizTarget.inf}, ${verbQuizTarget.pret}, ${verbQuizTarget.part}`);
  } else {
    fb.className = "mt-4 p-4 rounded-xl font-bold text-sm bg-red-100 text-red-800";
    fb.innerHTML = `❌ Правильные формы: Präteritum — <b>${verbQuizTarget.pret}</b> | Perfekt — <b>${verbQuizTarget.part}</b>`;
  }
}

function filterVerbTable() {
  const q = document.getElementById('verb-search').value.toLowerCase();
  const filtered = STRONG_VERBS.filter(v =>
    v.inf.toLowerCase().includes(q) ||
    v.pret.toLowerCase().includes(q) ||
    v.part.toLowerCase().includes(q) ||
    v.ru.toLowerCase().includes(q)
  );
  document.getElementById('verb-table-body').innerHTML = filtered.map(v => `
    <tr class="hover:bg-gray-50">
      <td class="p-3 font-black text-gray-800">
        <button onclick="speakGerman('${v.inf}, ${v.pres}, ${v.pret}, ${v.part}')" class="text-[#1cb0f6] mr-2"><i class="fa-solid fa-volume-high"></i></button>

      </td>
      <td class="p-3 font-bold text-blue-600">${v.pres}</td>
      <td class="p-3 font-bold text-purple-600">${v.pret}</td>
      <td class="p-3 font-bold text-green-600">${v.part}</td>
      <td class="p-3 font-semibold text-gray-500">${v.ru}</td>
    </tr>
  `).join('');
}

function renderPhoneticsView() {

    { comb: "eu / äu", sound: "[ой]", ex: "heute, Deutsch, neun, Häuser", desc: "Сочетания eu и äu всегда произносятся как «ОЙ»." },
    { comb: "sch", sound: "[ш]", ex: "Schule, schön, Tisch, schreiben", desc: "Три буквы передают один мягкий звук [Ш]." },
    { comb: "sp / st (в начале)", sound: "[шп] / [шт]", ex: "sprechen, Sport, Straße, Student", desc: "В начале слова или корня s перед p/t читается как [Ш]." },
    { comb: "ch (ich-Laut / ach-Laut)", sound: "[хь] / [х]", ex: "ich, mich, Buch, machen, Nacht", desc: "После a, o, u, au — твердый [Х]. После остальных гласных — мягкий [ХЬ]." },
    { comb: "tsch", sound: "[ч]", ex: "Deutsch, Tschüss, Kutsche", desc: "Четыре буквы передают звук [Ч]." },
    { comb: "v (Fau)", sound: "[ф] (в нем. словах)", ex: "Vater, vier, verstehen, viel", desc: "В исконно немецких словах читается как [Ф], в заимствованных (Vase) — как [В]." },
    { comb: "z (Zett)", sound: "[ц]", ex: "Zeit, zehn, Zimmer, zusammen", desc: "Всегда читается твердо как [Ц]." },
    { comb: "s (перед гласной)", sound: "[з]", ex: "sehen, sieben, Sonne, sagen", desc: "Перед гласной в начале или середине слова озвончается до [З]." },
    { comb: "ä / ö / ü (Umlaute)", sound: "[э] / [ё] / [ю]", ex: "Mädchen, schön, hören, fünf, über", desc: "Для ö и ü сложите губы трубочкой (как для О и У), но произнесите Э и И." },
    { comb: "ß (Eszett)", sound: "[с] (глухой)", ex: "heißen, Straße, groß, Fuß", desc: "Заменяет удвоенную ss после долгих гласных и дифтонгов." }
  ];

  const container = document.getElementById('main-container');
  container.innerHTML = `
    <div class="max-w-5xl mx-auto space-y-6">

      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
        ${rules.map(r => `
          <div onclick="speakGerman('${r.ex}')" class="card-duo p-5 cursor-pointer hover:border-[#1cb0f6] transition flex flex-col justify-between">

              </div>
              <p class="text-xs font-semibold text-gray-500 mb-3">${r.desc}</p>
            </div>
            <div class="p-3 bg-gray-50 rounded-xl border border-gray-200 flex items-center justify-between">
              <span class="font-extrabold text-sm text-gray-800">${r.ex}</span>
              <i class="fa-solid fa-volume-high text-[#1cb0f6]"></i>

          </div>
        `).join('')}
      </div>
    </div>
  `;
}
