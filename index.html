<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeutschProfi — Полная интерактивная платформа немецкого языка (A1–B2)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Nunito', sans-serif;
      background-color: #f7f7f7;
      user-select: none;
    }
    /* Тактильные 3D-кнопки в стиле Duolingo */
    .btn-duo-green {
      background-color: #58cc02;
      box-shadow: 0 4px 0 #58a700;
      color: white;
      transition: all 0.1s;
    }
    .btn-duo-green:hover { background-color: #61e002; }
    .btn-duo-green:active { transform: translateY(4px); box-shadow: 0 0px 0 #58a700; }

    .btn-duo-blue {
      background-color: #1cb0f6;
      box-shadow: 0 4px 0 #1899d6;
      color: white;
      transition: all 0.1s;
    }
    .btn-duo-blue:hover { background-color: #2bd5ff; }
    .btn-duo-blue:active { transform: translateY(4px); box-shadow: 0 0px 0 #1899d6; }

    .btn-duo-yellow {
      background-color: #ffc800;
      box-shadow: 0 4px 0 #e5a400;
      color: #4b4b4b;
      transition: all 0.1s;
    }
    .btn-duo-yellow:hover { background-color: #ffd426; }
    .btn-duo-yellow:active { transform: translateY(4px); box-shadow: 0 0px 0 #e5a400; }

    .btn-duo-purple {
      background-color: #ce82ff;
      box-shadow: 0 4px 0 #a559d9;
      color: white;
      transition: all 0.1s;
    }
    .btn-duo-purple:active { transform: translateY(4px); box-shadow: 0 0px 0 #a559d9; }

    .btn-duo-gray {
      background-color: #ffffff;
      border: 2px solid #e5e5e5;
      box-shadow: 0 4px 0 #e5e5e5;
      color: #4b4b4b;
      transition: all 0.1s;
    }
    .btn-duo-gray:hover { background-color: #f7f7f7; border-color: #cecece; }
    .btn-duo-gray:active { transform: translateY(4px); box-shadow: 0 0px 0 #e5e5e5; }

    .card-duo {
      background: white;
      border: 2px solid #e5e5e5;
      border-radius: 1.25rem;
      box-shadow: 0 4px 0 #e5e5e5;
    }

    /* 3D Переворот флеш-карт */
    .perspective { perspective: 1000px; }
    .flip-card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.55s cubic-bezier(0.4, 0.2, 0.2, 1);
      transform-style: preserve-3d;
    }
    .flipped .flip-card-inner {
      transform: rotateY(180deg);
    }
    .flip-card-front, .flip-card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 1.5rem;
    }
    .flip-card-back {
      transform: rotateY(180deg);
    }
  </style>
</head>
<body class="text-gray-800 h-screen flex overflow-hidden">

  <!-- Боковая панель навигации -->
  <aside class="w-64 bg-white border-r-2 border-gray-200 flex flex-col justify-between z-20 shrink-0">
    <div>
      <!-- Логотип -->
      <div class="p-6 flex items-center space-x-3 border-b-2 border-gray-100">
        <div class="w-11 h-11 rounded-2xl bg-[#58cc02] flex items-center justify-center text-white font-black text-2xl shadow-[0_4px_0_#58a700]">
          🇩🇪
        </div>
        <div>
          <span class="font-black text-2xl tracking-tight text-[#58cc02]">Deutsch</span><span class="font-black text-2xl tracking-tight text-gray-700">Profi</span>
          <div class="text-[10px] font-extrabold uppercase tracking-widest text-gray-400">Учебник A1 — B2</div>
        </div>
      </div>

      <!-- Меню -->
      <nav class="p-4 space-y-2">
        <button onclick="switchTab('path')" id="nav-path" class="w-full flex items-center space-x-4 px-4 py-3 rounded-xl font-extrabold text-sm uppercase tracking-wider bg-blue-50 text-[#1cb0f6] border-2 border-[#1cb0f6]">
          <i class="fa-solid fa-map-location-dot text-xl w-6 text-center"></i>
          <span>Карта уроков (12)</span>
        </button>
        <button onclick="switchTab('verbs')" id="nav-verbs" class="w-full flex items-center space-x-4 px-4 py-3 rounded-xl font-extrabold text-sm uppercase tracking-wider text-gray-500 hover:bg-gray-100 border-2 border-transparent">
          <i class="fa-solid fa-dumbbell text-xl w-6 text-center text-orange-500"></i>
          <span>Сильные глаголы</span>
        </button>
        <button onclick="switchTab('grammar')" id="nav-grammar" class="w-full flex items-center space-x-4 px-4 py-3 rounded-xl font-extrabold text-sm uppercase tracking-wider text-gray-500 hover:bg-gray-100 border-2 border-transparent">
          <i class="fa-solid fa-book-bookmark text-xl w-6 text-center text-purple-500"></i>
          <span>Грамматика А-Я</span>
        </button>
        <button onclick="switchTab('phonetics')" id="nav-phonetics" class="w-full flex items-center space-x-4 px-4 py-3 rounded-xl font-extrabold text-sm uppercase tracking-wider text-gray-500 hover:bg-gray-100 border-2 border-transparent">
          <i class="fa-solid fa-volume-high text-xl w-6 text-center text-green-500"></i>
          <span>Фонетика и Чтение</span>
        </button>
      </nav>
    </div>

    <!-- Прогресс внизу сайдбара -->
    <div class="p-4 m-4 bg-gray-50 rounded-2xl border-2 border-gray-200">
      <div class="text-xs font-extrabold uppercase text-gray-400 mb-2">Прогресс учебника</div>
      <div class="w-full bg-gray-200 h-3 rounded-full overflow-hidden mb-2">
        <div id="sidebar-progress-bar" class="bg-[#58cc02] h-full transition-all duration-500" style="width: 0%"></div>
      </div>
      <div class="flex justify-between items-center text-xs font-bold text-gray-600">
        <span id="sidebar-completed-text">0 из 12 тем</span>
        <button onclick="resetProgress()" class="text-red-400 hover:underline">Сбросить</button>
      </div>
    </div>
  </aside>

  <!-- Основная рабочая область -->
  <div class="flex-1 flex flex-col h-screen overflow-hidden">
    <!-- Верхний бар со статистикой -->
    <header class="h-16 bg-white border-b-2 border-gray-200 px-8 flex items-center justify-between shrink-0 z-10">
      <div class="flex items-center space-x-2">
        <button onclick="filterLevel('ALL')" id="lvl-ALL" class="px-3 py-1 rounded-lg font-black text-xs uppercase bg-gray-800 text-white">Все (12)</button>
        <button onclick="filterLevel('A1')" id="lvl-A1" class="px-3 py-1 rounded-lg font-black text-xs uppercase bg-green-100 text-green-700 hover:bg-green-200">A1</button>
        <button onclick="filterLevel('A2')" id="lvl-A2" class="px-3 py-1 rounded-lg font-black text-xs uppercase bg-amber-100 text-amber-700 hover:bg-amber-200">A2</button>
        <button onclick="filterLevel('B1')" id="lvl-B1" class="px-3 py-1 rounded-lg font-black text-xs uppercase bg-purple-100 text-purple-700 hover:bg-purple-200">B1</button>
        <button onclick="filterLevel('B2')" id="lvl-B2" class="px-3 py-1 rounded-lg font-black text-xs uppercase bg-pink-100 text-pink-700 hover:bg-pink-200">B2</button>
      </div>

      <div class="flex items-center space-x-6">
        <!-- Ударный режим -->
        <div class="flex items-center space-x-2 font-extrabold text-orange-500" title="Ударный режим (дни подряд)">
          <i class="fa-solid fa-fire text-xl"></i>
          <span id="stat-streak">5</span>
        </div>
        <!-- Очки опыта XP -->
        <div class="flex items-center space-x-2 font-extrabold text-[#ffc800]" title="Очки опыта (XP)">
          <i class="fa-solid fa-bolt text-xl"></i>
          <span id="stat-xp">250</span><span>XP</span>
        </div>
        <!-- Жизни -->
        <div class="flex items-center space-x-2 font-extrabold text-red-500" title="Запас сердец (нажмите для восстановления)" onclick="restoreHearts()">
          <i class="fa-solid fa-heart text-xl cursor-pointer"></i>
          <span id="stat-hearts">5</span>
        </div>
        <!-- Кнопка проверки звука -->
        <button onclick="speakGerman('Willkommen bei DeutschProfi! Viel Erfolg beim Lernen!')" class="btn-duo-gray px-3 py-1.5 rounded-xl text-xs font-extrabold flex items-center space-x-2">
          <i class="fa-solid fa-headphones text-[#1cb0f6]"></i>
          <span>Проверка звука</span>
        </button>
      </div>
    </header>

    <!-- Контент вкладок -->
    <main id="main-container" class="flex-1 overflow-y-auto p-6 md:p-10">
      <!-- Рендерится динамически -->
    </main>
  </div>

<script>
// Глобальные переменные состояния
let currentTab = 'path';
let currentLevelFilter = 'ALL';
let xp = 250;
let hearts = 5;
let streak = 5;
let completedModules = JSON.parse(localStorage.getItem('dp_completed') || '[]');

// Данные уроков
const MODULES = [
  {
    id: "a1_1",
    level: "A1",
    title: "Урок 1: Знакомство, О себе, Спряжение и sein / haben",
    subtitle: "Приветствия, личные местоимения, числа, правило V2",
    color: "#58cc02",
    icon: "fa-handshake",
    grammarHTML: `
      <div class="space-y-4">
        <div class="bg-green-50 border-l-4 border-[#58cc02] p-4 rounded-r-xl">
          <h4 class="font-black text-green-900 mb-1">1. Спряжение глаголов в Präsens</h4>
          <p class="text-sm text-green-800">Убираем окончание <b>-en</b> и добавляем окончания: ich -e, du -st, er/sie/es -t, wir -en, ihr -t, sie/Sie -en.</p>
        </div>
        <div class="bg-blue-50 border-l-4 border-[#1cb0f6] p-4 rounded-r-xl text-sm text-blue-900">
          <b>2. Порядок слов (Правило V2):</b> Спрягаемый глагол всегда стоит на 2-м месте в повествовательном предложении.
        </div>
      </div>
    `,
    vocab: [
      { de: "heißen", ru: "зваться, называться", ex: "Wie heißen Sie? Ich heiße Markus." },
      { de: "kommen", ru: "приходить, быть родом", ex: "Woher kommst du? Ich komme aus der Ukraine." },
      { de: "wohnen", ru: "жить, проживать", ex: "Wir wohnen jetzt in München." }
    ],
    dialogues: [
      { speaker: "Anna", de: "Guten Tag! Ich heiße Anna.", ru: "Добрый день! Меня зовут Анна." },
      { speaker: "Thomas", de: "Guten Tag! Freut mich sehr!", ru: "Добрый день! Очень приятно!" }
    ],
    grammarQuestions: [
      { type: "mc", q: "Выберите форму sein: «Ich ___ 22 Jahre alt.»", options: ["bin", "bist", "ist", "sind"], a: "bin", exp: "С ich используется bin." },
      { type: "mc", q: "Выберите форму: «Woher ___ du?»", options: ["komme", "kommst", "kommt", "kommen"], a: "kommst", exp: "Для du окончание -st." }
    ]
  },
  {
    id: "a1_2",
    level: "A1",
    title: "Урок 2: Семья, Еда, Покупки и Akkusativ",
    subtitle: "Определенный и неопределенный артикль в Винительном падеже",
    color: "#38bdf8",
    icon: "fa-cart-shopping",
    grammarHTML: `
      <div class="space-y-4">
        <div class="bg-blue-50 border-l-4 border-blue-500 p-4 rounded-r-xl">
          <h4 class="font-black text-blue-900 mb-1">Винительный падеж (Akkusativ)</h4>
          <p class="text-sm text-blue-800">В Akkusativ изменяется только мужской род: der -> den, ein -> einen, kein -> keinen.</p>
        </div>
      </div>
    `,
    vocab: [
      { de: "kaufen", ru: "покупать", ex: "Ich kaufe einen Apfel." },
      { de: "brauchen", ru: "нуждаться", ex: "Wir brauchen Hilfe." }
    ],
    dialogues: [
      { speaker: "Kunde", de: "Ich hätte gerne einen Kaffee.", ru: "Я бы хотел кофе." }
    ],
    grammarQuestions: [
      { type: "mc", q: "Выберите правильный артикль: «Ich trinke ___ Kaffee (m).»", options: ["einen", "eine", "ein", "der"], a: "einen", exp: "В Akkusativ мужской род принимает einen." }
    ]
  }
];

// Функция переключения вкладок
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('aside nav button').forEach(btn => {
    btn.className = "w-full flex items-center space-x-4 px-4 py-3 rounded-xl font-extrabold text-sm uppercase tracking-wider text-gray-500 hover:bg-gray-100 border-2 border-transparent";
  });
  const activeBtn = document.getElementById('nav-' + tab);
  if (activeBtn) {
    activeBtn.className = "w-full flex items-center space-x-4 px-4 py-3 rounded-xl font-extrabold text-sm uppercase tracking-wider bg-blue-50 text-[#1cb0f6] border-2 border-[#1cb0f6]";
  }
  renderContent();
}

function filterLevel(lvl) {
  currentLevelFilter = lvl;
  ['ALL', 'A1', 'A2', 'B1', 'B2'].forEach(l => {
    const b = document.getElementById('lvl-' + l);
    if(b) {
      if(l === lvl) b.className = "px-3 py-1 rounded-lg font-black text-xs uppercase bg-gray-800 text-white";
      else b.className = "px-3 py-1 rounded-lg font-black text-xs uppercase bg-gray-200 text-gray-700 hover:bg-gray-300";
    }
  });
  renderContent();
}

function renderContent() {
  const container = document.getElementById('main-container');
  if (!container) return;

  if (currentTab === 'path') {
    let html = `<div class="max-w-3xl mx-auto space-y-6"><h2 class="text-2xl font-black mb-4">Карта уроков немецкого языка</h2>`;
    MODULES.forEach((m, idx) => {
      if (currentLevelFilter !== 'ALL' && m.level !== currentLevelFilter) return;
      const isDone = completedModules.includes(m.id);
      html += `
        <div class="card-duo p-6 flex items-center justify-between">
          <div class="flex items-center space-x-4">
            <div class="w-14 h-14 rounded-2xl flex items-center justify-center text-white text-2xl font-black shadow-md" style="background-color: ${m.color}">
              <i class="fa-solid ${m.icon}"></i>
            </div>
            <div>
              <span class="text-xs font-black px-2 py-0.5 rounded bg-gray-100 text-gray-600">${m.level}</span>
              <h3 class="font-black text-lg text-gray-800 mt-1">${m.title}</h3>
              <p class="text-xs text-gray-500 mt-0.5">${m.subtitle}</p>
            </div>
          </div>
          <button onclick="alert('Урок открыт!')" class="btn-duo-green px-6 py-2.5 rounded-xl font-black text-sm uppercase">
            ${isDone ? 'Повторить' : 'Начать'}
          </button>
        </div>
      `;
    });
    html += `</div>`;
    container.innerHTML = html;
  } else {
    container.innerHTML = `<div class="text-center py-20 text-gray-400 font-bold">Раздел в разработке</div>`;
  }
}

function speakGerman(text) {
  if ('speechSynthesis' in window) {
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'de-DE';
    window.speechSynthesis.speak(utterance);
  }
}

function restoreHearts() {
  hearts = 5;
  updateStats();
  alert('Сердца восстановлены!');
}

function resetProgress() {
  if(confirm('Сбросить весь прогресс?')) {
    completedModules = [];
    localStorage.removeItem('dp_completed');
    renderContent();
  }
}

function updateStats() {
  document.getElementById('stat-xp').innerText = xp;
  document.getElementById('stat-hearts').innerText = hearts;
  document.getElementById('stat-streak').innerText = streak;
  const percent = Math.round((completedModules.length / MODULES.length) * 100);
  document.getElementById('sidebar-progress-bar').style.width = percent + '%';
  document.getElementById('sidebar-completed-text').innerText = `${completedModules.length} из ${MODULES.length} тем`;
}

// Инициализация при загрузке
window.onload = function() {
  renderContent();
  updateStats();
};
</script>
</body>
</html>
