<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeutschProfi — Интерактивная платформа немецкого языка (A1–B2)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Nunito', sans-serif;
      background-color: #f7f7f7;
      user-select: none;
    }
    .btn-duo-green {
      background-color: #58cc02;
      box-shadow: 0 4px 0 #58a700;
      color: white;
      transition: all 0.1s;
    }
    .btn-duo-green:hover { background-color: #61e002; }
    .btn-duo-green:active { transform: translateY(4px); box-shadow: 0 0px 0 #58a700; }

    .btn-duo-blue {
      background-color: #1cb0f6;
      box-shadow: 0 4px 0 #1899d6;
      color: white;
      transition: all 0.1s;
    }
    .btn-duo-blue:hover { background-color: #2bd5ff; }
    .btn-duo-blue:active { transform: translateY(4px); box-shadow: 0 0px 0 #1899d6; }

    .btn-duo-gray {
      background-color: #ffffff;
      border: 2px solid #e5e5e5;
      box-shadow: 0 4px 0 #e5e5e5;
      color: #4b4b4b;
      transition: all 0.1s;
    }
    .btn-duo-gray:hover { background-color: #f7f7f7; border-color: #cecece; }
    .btn-duo-gray:active { transform: translateY(4px); box-shadow: 0 0px 0 #e5e5e5; }

    .card-duo {
      background: white;
      border: 2px solid #e5e5e5;
      border-radius: 1.25rem;
      box-shadow: 0 4px 0 #e5e5e5;
    }
  </style>
</head>
<body class="text-gray-800 h-screen flex overflow-hidden">

  <!-- Боковая панель -->
  <aside class="w-64 bg-white border-r-2 border-gray-200 flex flex-col justify-between z-20 shrink-0">
    <div>
      <div class="p-6 flex items-center space-x-3 border-b-2 border-gray-100">
        <div class="w-11 h-11 rounded-2xl bg-[#58cc02] flex items-center justify-center text-white font-black text-2xl shadow-[0_4px_0_#58a700]">
          🇩🇪
        </div>
        <div>
          <span class="font-black text-2xl tracking-tight text-[#58cc02]">Deutsch</span><span class="font-black text-2xl tracking-tight text-gray-700">Profi</span>
          <div class="text-[10px] font-extrabold uppercase tracking-widest text-gray-400">Учебник A1 — B2</div>
        </div>
      </div>

      <nav class="p-4 space-y-2">
        <button onclick="switchTab('path')" id="nav-path" class="w-full flex items-center space-x-4 px-4 py-3 rounded-xl font-extrabold text-sm uppercase tracking-wider bg-blue-50 text-[#1cb0f6] border-2 border-[#1cb0f6]">
          <i class="fa-solid fa-map-location-dot text-xl w-6 text-center"></i>
          <span>Карта уроков</span>
        </button>
      </nav>
    </div>

    <div class="p-4 m-4 bg-gray-50 rounded-2xl border-2 border-gray-200">
      <div class="text-xs font-extrabold uppercase text-gray-400 mb-2">Прогресс учебника</div>
      <div class="w-full bg-gray-200 h-3 rounded-full overflow-hidden mb-2">
        <div id="sidebar-progress-bar" class="bg-[#58cc02] h-full transition-all duration-500" style="width: 0%"></div>
      </div>
      <div class="flex justify-between items-center text-xs font-bold text-gray-600">
        <span id="sidebar-completed-text">0 из 2 тем</span>
        <button onclick="resetProgress()" class="text-red-400 hover:underline">Сбросить</button>
      </div>
    </div>
  </aside>

  <!-- Основная область -->
  <div class="flex-1 flex flex-col h-screen overflow-hidden">
    <header class="h-16 bg-white border-b-2 border-gray-200 px-8 flex items-center justify-between shrink-0 z-10">
      <div class="flex items-center space-x-2">
        <span class="font-black text-lg text-gray-700" id="header-title">Главное меню</span>
      </div>

      <div class="flex items-center space-x-6">
        <div class="flex items-center space-x-2 font-extrabold text-orange-500">
          <i class="fa-solid fa-fire text-xl"></i>
          <span id="stat-streak">5</span>
        </div>
        <div class="flex items-center space-x-2 font-extrabold text-[#ffc800]">
          <i class="fa-solid fa-bolt text-xl"></i>
          <span id="stat-xp">250</span><span>XP</span>
        </div>
        <div class="flex items-center space-x-2 font-extrabold text-red-500">
          <i class="fa-solid fa-heart text-xl"></i>
          <span id="stat-hearts">5</span>
        </div>
      </div>
    </header>

    <main id="main-container" class="flex-1 overflow-y-auto p-6 md:p-10 bg-gray-50">
      <!-- Сюда динамически грузится контент -->
    </main>
  </div>

<script>
let xp = 250;
let hearts = 5;
let streak = 5;
let completedModules = JSON.parse(localStorage.getItem('dp_completed') || '[]');

const MODULES = [
  {
    id: "a1_1",
    level: "A1",
    title: "Урок 1: Знакомство и глаголы sein / haben",
    subtitle: "Приветствия, личные местоимения, правило V2",
    color: "#58cc02",
    icon: "fa-handshake",
    theory: "В немецком языке глаголы-связки sein (быть) и haben (иметь) спрягаются особым образом. Главное правило порядка слов (V2) требует, чтобы спрягаемый глагол всегда стоял на втором месте в предложении.",
    vocab: [
      { de: "heißen", ru: "зваться, называться" },
      { de: "kommen", ru: "приходить, быть родом" },
      { de: "wohnen", ru: "жить, проживать" }
    ],
    question: {
      q: "Выберите правильную форму глагола sein: «Ich ___ 22 Jahre alt.»",
      options: ["bin", "bist", "ist", "sind"],
      a: "bin"
    }
  },
  {
    id: "a1_2",
    level: "A1",
    title: "Урок 2: Покупки и Винительный падеж (Akkusativ)",
    subtitle: "Определенный и неопределенный артикль в Akkusativ",
    color: "#38bdf8",
    icon: "fa-cart-shopping",
    theory: "Винительный падеж (Akkusativ) отвечает на вопросы Wen? Was? (Кого? Что?). Изменяется только артикль мужского рода: der превращается в den, ein в einen.",
    vocab: [
      { de: "kaufen", ru: "покупать" },
      { de: "brauchen", ru: "нуждаться" }
    ],
    question: {
      q: "Выберите правильный артикль: «Ich trinke ___ Kaffee (m).»",
      options: ["einen", "eine", "ein", "der"],
      a: "einen"
    }
  }
];

function switchTab(tab) {
  renderPath();
}

function renderPath() {
  document.getElementById('header-title').innerText = "Карта уроков немецкого языка";
  const container = document.getElementById('main-container');
  let html = `<div class="max-w-3xl mx-auto space-y-6">`;
  
  MODULES.forEach((m) => {
    const isDone = completedModules.includes(m.id);
    html += `
      <div class="card-duo p-6 flex items-center justify-between bg-white">
        <div class="flex items-center space-x-4">
          <div class="w-14 h-14 rounded-2xl flex items-center justify-center text-white text-2xl font-black shadow-md" style="background-color: ${m.color}">
            <i class="fa-solid ${m.icon}"></i>
          </div>
          <div>
            <span class="text-xs font-black px-2 py-0.5 rounded bg-gray-100 text-gray-600">${m.level}</span>
            <h3 class="font-black text-lg text-gray-800 mt-1">${m.title}</h3>
            <p class="text-xs text-gray-500 mt-0.5">${m.subtitle}</p>
          </div>
        </div>
        <button onclick="startLesson('${m.id}')" class="btn-duo-green px-6 py-2.5 rounded-xl font-black text-sm uppercase">
          ${isDone ? 'Повторить' : 'Начать'}
        </button>
      </div>
    `;
  });
  html += `</div>`;
  container.innerHTML = html;
}

function startLesson(id) {
  const m = MODULES.find(item => item.id === id);
  document.getElementById('header-title').innerText = m.title;
  const container = document.getElementById('main-container');

  let vocabHtml = m.vocab.map(v => `
    <div class="flex justify-between items-center p-3 bg-gray-50 rounded-xl border border-gray-200">
      <span class="font-bold text-gray-800">${v.de}</span>
      <span class="text-gray-500 text-sm">${v.ru}</span>
      <button onclick="speak('${v.de}')" class="text-[#1cb0f6]"><i class="fa-solid fa-volume-high"></i></button>
    </div>
  `).join('');

  let optionsHtml = m.question.options.map(opt => `
    <button onclick="checkAnswer('${opt}', '${m.question.a}', '${m.id}')" class="w-full text-left p-4 rounded-xl border-2 border-gray-200 hover:border-[#1cb0f6] font-bold bg-white shadow-sm transition">${opt}</button>
  `).join('');

  container.innerHTML = `
    <div class="max-w-2xl mx-auto space-y-6">
      <button onclick="renderPath()" class="text-gray-500 font-bold hover:underline mb-4"><i class="fa-solid fa-arrow-left"></i> Назад к карте</button>
      
      <div class="card-duo p-6 bg-white space-y-4">
        <h3 class="font-black text-xl text-gray-800">📖 Теория</h3>
        <p class="text-gray-600 leading-relaxed">${m.theory}</p>
      </div>

      <div class="card-duo p-6 bg-white space-y-3">
        <h3 class="font-black text-xl text-gray-800">🗣 Словарь урока</h3>
        <div class="space-y-2">${vocabHtml}</div>
      </div>

      <div class="card-duo p-6 bg-white space-y-4" id="quiz-box">
        <h3 class="font-black text-xl text-gray-800">✍️ Проверка знаний</h3>
        <p class="font-bold text-gray-700 text-lg">${m.question.q}</p>
        <div class="space-y-2">${optionsHtml}</div>
      </div>
    </div>
  `;
}

function checkAnswer(selected, correct, id) {
  const box = document.getElementById('quiz-box');
  if (selected === correct) {
    if (!completedModules.includes(id)) {
      completedModules.push(id);
      localStorage.setItem('dp_completed', JSON.stringify(completedModules));
      xp += 15;
      updateStats();
    }
    box.innerHTML = `
      <div class="p-6 bg-green-50 border-2 border-green-500 rounded-2xl text-center space-y-4">
        <h3 class="font-black text-2xl text-green-700">🎉 Правильно! +15 XP</h3>
        <button onclick="renderPath()" class="btn-duo-green px-8 py-3 rounded-xl font-black uppercase">Продолжить</button>
      </div>
    `;
  } else {
    hearts = Math.max(0, hearts - 1);
    updateStats();
    alert('Неправильно! Попробуй еще раз.');
  }
}

function speak(text) {
  if ('speechSynthesis' in window) {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'de-DE';
    window.speechSynthesis.speak(u);
  }
}

function updateStats() {
  document.getElementById('stat-xp').innerText = xp;
  document.getElementById('stat-hearts').innerText = hearts;
  document.getElementById('stat-streak').innerText = streak;
  const percent = Math.round((completedModules.length / MODULES.length) * 100);
  document.getElementById('sidebar-progress-bar').style.width = percent + '%';
  document.getElementById('sidebar-completed-text').innerText = `${completedModules.length} из ${MODULES.length} тем`;
}

window.onload = function() {
  renderPath();
  updateStats();
};
</script>
</body>
</html>
